; =======================================================
; Delta India Terminal - Supervisor Configuration (TASK-P15-01)
; =======================================================

[supervisord]
logfile=/var/log/delta-terminal/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/delta-terminal/supervisord.pid
nodaemon=false
minfds=10240
minprocs=200

[unix_http_server]
file=/var/run/delta-terminal/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/delta-terminal/supervisor.sock

; Main Application Process
[program:delta-terminal]
command=python app.py
directory=/opt/delta-terminal
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=unexpected
startsecs=5
startretries=5
exitcodes=0
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/delta-terminal/app_stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=7
stderr_logfile=/var/log/delta-terminal/app_stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=7

; Periodic Database Backup (Hourly)
[program:delta-db-backup]
command=python scripts/backup_db.py --retention-days 7
directory=/opt/delta-terminal
autostart=false
autorestart=false
startretries=1
stdout_logfile=/var/log/delta-terminal/backup_stdout.log
stderr_logfile=/var/log/delta-terminal/backup_stderr.log
